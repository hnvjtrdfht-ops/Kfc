name: Update TGA data

on:
  schedule:
    # 매일 22:23 UTC (한국 07:23). 목요일 H.4.1 발표(16:30 ET) 이후 반영됨.
    - cron: "23 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["index.html", "app.js", "scripts/**", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tga-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch data
        run: python scripts/fetch_data.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tga.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: TGA 주간 데이터 갱신 $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Build site
        run: |
          mkdir -p _site/data
          cp index.html app.js _site/
          cp data/tga.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
